# admin/config.yml — Decap CMS.
#
# Decap is a git-based CMS: it has no database. Every save is a commit to
# github.com/denixxo/Website, and GitHub Pages redeploys from that commit.
# Netlify supplies only the login (Identity) and the token exchange
# (Git Gateway) — it never holds a copy of the content.
#
# A Decap file collection maps a file's top-level keys to fields. The four list
# files therefore each hold a single named list, e.g. { "posters": [ ... ] };
# site.json, cv.json and portraits.json are plain objects whose keys are the
# fields themselves. js/boot.js fetches these files and hands them to the page
# scripts as window.SITE.*.

backend:
  name: git-gateway
  branch: main
  commit_messages:
    update: 'content: update {{collection}}'
    uploadMedia: 'content: upload {{path}}'
    deleteMedia: 'content: delete {{path}}'

publish_mode: simple

# Only active when /admin is served from localhost: the CMS then talks to
# `npx decap-server` against the local checkout instead of Identity, so the
# editor can be opened without logging in. Ignored on the deployed site.
local_backend: true

site_url: https://jankovic.phd
display_url: https://jankovic.phd
logo_url: https://jankovic.phd/favicon.svg

# Fallback for uploads made outside a field that sets its own folder.
media_folder: 'assets/img'
public_folder: 'assets/img'

collections:
  # ---------------------------------------------------------------- papers ---
  - name: publications
    label: Publications
    files:
      - name: publications
        label: Publication list
        file: data/publications.json
        description: >-
          Papers, preprints and the thesis. Sorted automatically by year and
          month — the order here does not matter.
        fields:
          - name: publications
            label: Publications
            label_singular: Publication
            widget: list
            collapsed: true
            summary: '{{fields.year}} · {{fields.title}}'
            fields:
              - name: id
                label: ID
                widget: string
                hint: 'year-venue-slug (e.g. 2024-npjqi-noisy-qudit). Also the PDF and thumbnail filename.'
              - name: type
                label: Type
                widget: select
                default: article
                options: [article, preprint, thesis]
              - name: year
                label: Year
                widget: number
                value_type: int
                min: 1990
                max: 2100
              - name: month
                label: Month
                widget: number
                value_type: int
                min: 1
                max: 12
                required: false
                hint: '1–12. Leave empty if unknown; only affects sort order within a year.'
              - name: authors
                label: Authors
                widget: string
                hint: 'Comma-separated, in publication order: D. Janković, J.-G. Hartmann, …'
              - name: title
                label: Title
                widget: string
              - name: journal
                label: Journal / venue
                widget: string
                required: false
                hint: 'With volume and pages, e.g. "npj Quantum Information 10, 59". Leave empty for a preprint — the arXiv ID is shown instead.'
              - name: doi
                label: DOI
                widget: string
                required: false
                hint: 'Bare DOI, without the https://doi.org/ prefix.'
              - name: arxiv
                label: arXiv ID
                widget: string
                required: false
                hint: 'e.g. 2408.13601'
              - name: pdf
                label: PDF
                widget: file
                required: false
                media_folder: '/assets/pdf/publications'
                public_folder: 'assets/pdf/publications'
              - name: thumbnail
                label: Thumbnail
                widget: image
                required: false
                media_folder: '/assets/img/pubs'
                public_folder: 'assets/img/pubs'
                hint: '900×429 WebP. tools/make_thumbnails.py generates these from the PDF.'
              - name: selected
                label: Feature on the homepage
                widget: boolean
                default: false
              - name: topics
                label: Topics
                widget: list
                hint: 'Filter chips. Existing: qudits, open-systems, numerics, esr-stm, optimal-control, encoding, hyperfine, nuclear'
              - name: bibtex
                label: BibTeX
                widget: text
                hint: 'Paste the entry exactly as BibTeX wants it. The old rule about doubling backslashes was a JavaScript quirk and no longer applies.'
              - name: notes
                label: One-line note
                widget: object
                fields:
                  - { name: en, label: English, widget: text }
                  - { name: fr, label: Français, widget: text, required: false }
                  - { name: ko, label: 한국어, widget: text, required: false }
                  - { name: de, label: Deutsch, widget: text, required: false }

  # ----------------------------------------------------------------- talks ---
  - name: presentations
    label: Talks
    files:
      - name: presentations
        label: Talk list
        file: data/presentations.json
        description: 'Invited talks, contributed talks and seminars.'
        fields:
          - name: presentations
            label: Talks
            label_singular: Talk
            widget: list
            collapsed: true
            summary: '{{fields.year}} · {{fields.title}}'
            fields:
              - name: id
                label: ID
                widget: string
                hint: 'year-venue-slug. Also the PDF and thumbnail filename.'
              - name: year
                label: Year
                widget: number
                value_type: int
                min: 1990
                max: 2100
                required: false
              - name: month
                label: Month
                widget: number
                value_type: int
                min: 1
                max: 12
                required: false
              - name: title
                label: Title
                widget: string
              - name: event
                label: Event
                widget: string
                hint: 'Conference or seminar series, with the acronym in brackets if there is one.'
              - name: location
                label: Location
                widget: string
                required: false
                hint: 'City, Country'
              - name: type
                label: Type
                widget: select
                default: contributed
                options: [invited, contributed, seminar]
              - name: award
                label: Award / distinction
                widget: object
                required: false
                hint: 'Leave every language empty if there was none — the badge is hidden when all four are blank.'
                fields:
                  - { name: en, label: English, widget: string, required: false }
                  - { name: fr, label: Français, widget: string, required: false }
                  - { name: ko, label: 한국어, widget: string, required: false }
                  - { name: de, label: Deutsch, widget: string, required: false }
              - name: pdf
                label: Slide deck
                widget: file
                required: false
                media_folder: '/assets/pdf/presentations'
                public_folder: 'assets/pdf/presentations'
              - name: video
                label: Video URL
                widget: string
                required: false
                hint: 'Full URL to a recording, if one exists.'
              - name: thumbnail
                label: Thumbnail
                widget: image
                required: false
                media_folder: '/assets/img/talks'
                public_folder: 'assets/img/talks'
                hint: '16:9, 400×225 WebP.'

  # --------------------------------------------------------------- posters ---
  - name: posters
    label: Posters
    files:
      - name: posters
        label: Poster list
        file: data/posters.json
        description: 'Poster gallery. Thumbnails are full-page renders of the PDF.'
        fields:
          - name: posters
            label: Posters
            label_singular: Poster
            widget: list
            collapsed: true
            summary: '{{fields.year}} · {{fields.title}}'
            fields:
              - name: id
                label: ID
                widget: string
                hint: 'year-poster-slug. Also the PDF and thumbnail filename.'
              - name: year
                label: Year
                widget: number
                value_type: int
                min: 1990
                max: 2100
              - name: title
                label: Title
                widget: string
              - name: event
                label: Event
                widget: string
              - name: location
                label: Location
                widget: string
                required: false
                hint: 'City, Country'
              - name: award
                label: Award / distinction
                widget: object
                required: false
                hint: 'Leave every language empty if there was none.'
                fields:
                  - { name: en, label: English, widget: string, required: false }
                  - { name: fr, label: Français, widget: string, required: false }
                  - { name: ko, label: 한국어, widget: string, required: false }
                  - { name: de, label: Deutsch, widget: string, required: false }
              - name: pdf
                label: PDF
                widget: file
                required: false
                media_folder: '/assets/pdf/posters'
                public_folder: 'assets/pdf/posters'
              - name: thumbnail
                label: Thumbnail
                widget: image
                required: false
                media_folder: '/assets/img/posters'
                public_folder: 'assets/img/posters'

  # -------------------------------------------------------------- teaching ---
  - name: lectures
    label: Teaching
    files:
      - name: lectures
        label: Teaching list
        file: data/lectures.json
        description: >-
          Lectures, lab courses and tutorials. Material buttons appear only once
          the corresponding file exists on the server.
        fields:
          - name: lectures
            label: Courses
            label_singular: Course
            widget: list
            collapsed: true
            summary: '{{fields.years}} · {{fields.title}}'
            fields:
              - name: id
                label: ID
                widget: string
                hint: 'institution-topic slug. Material filenames are built from it: <id>-slides.pdf, <id>-handout.pdf, …'
              - name: year
                label: Sort year
                widget: number
                value_type: int
                min: 1990
                max: 2100
                hint: 'Used for ordering — give the end year of the range.'
              - name: years
                label: Displayed years
                widget: string
                hint: 'e.g. "2024 – 2025" or "2025"'
              - name: title
                label: Title
                widget: string
              - name: institution
                label: Institution
                widget: string
              - name: level
                label: Level
                widget: string
                required: false
                hint: 'e.g. M1–M2 / PhD'
              - name: hours
                label: Hours
                widget: number
                value_type: int
                required: false
              - name: type
                label: Type
                widget: select
                default: lecture
                options: [lecture, lab, tutorial, oral, coordination]
              - name: desc
                label: Description
                widget: object
                required: false
                fields:
                  - { name: en, label: English, widget: text, required: false }
                  - { name: fr, label: Français, widget: text, required: false }
                  - { name: ko, label: 한국어, widget: text, required: false }
                  - { name: de, label: Deutsch, widget: text, required: false }
              - name: slides
                label: Slides
                widget: file
                required: false
                media_folder: '/assets/lectures'
                public_folder: 'assets/lectures'
              - name: notebooks
                label: Notebooks
                widget: file
                required: false
                media_folder: '/assets/lectures'
                public_folder: 'assets/lectures'
              - name: handouts
                label: Handouts
                widget: file
                required: false
                media_folder: '/assets/lectures'
                public_folder: 'assets/lectures'
              - name: tutorial
                label: Tutorial sheet
                widget: file
                required: false
                media_folder: '/assets/lectures'
                public_folder: 'assets/lectures'

  # -------------------------------------------------------------------- cv ---
  # Every text on the CV is an { en, fr, ko, de } object. The three shapes —
  # English required, all optional, and all optional as multi-line boxes — are
  # written out once, named with a YAML anchor (&text, &text_optional, &prose),
  # and reused through aliases (*text …) so they cannot drift apart.
  - name: cv
    label: CV
    files:
      - name: cv
        label: Curriculum vitae
        file: data/cv.json
        description: >-
          Everything on the CV page, in the order it is shown there. A language
          left empty shows the English text, so names and acronyms only need
          the English box. The downloadable PDFs are under Misc → CV & site
          files.
        fields:
          - name: contact
            label: Contact
            label_singular: Address
            widget: list
            required: false
            collapsed: false
            field: { name: address, label: Address, widget: string }
            hint: 'An email address becomes a mail link, an https:// address a link, a phone number a call link.'
          - name: location
            label: Location
            label_singular: Line
            widget: list
            required: false
            collapsed: true
            summary: '{{fields.en}}'
            fields: &text
              - { name: en, label: English, widget: string }
              - { name: fr, label: Français, widget: string, required: false }
              - { name: ko, label: 한국어, widget: string, required: false }
              - { name: de, label: Deutsch, widget: string, required: false }
          - name: languages
            label: Languages
            label_singular: Language
            widget: list
            required: false
            collapsed: true
            summary: '{{fields.name.en}} · {{fields.level.en}}'
            fields:
              - { name: name, label: Language, widget: object, fields: *text }
              - name: dots
                label: Dots
                widget: number
                value_type: int
                min: 0
                max: 5
                default: 3
                hint: 'Filled dots, out of five.'
              - name: level
                label: Level
                widget: object
                required: false
                hint: 'e.g. Native, or C1 — a CEFR level reads the same everywhere, so English alone is enough.'
                fields: &text_optional
                  - { name: en, label: English, widget: string, required: false }
                  - { name: fr, label: Français, widget: string, required: false }
                  - { name: ko, label: 한국어, widget: string, required: false }
                  - { name: de, label: Deutsch, widget: string, required: false }
          - name: skills
            label: Skill groups
            label_singular: Skill group
            widget: list
            required: false
            collapsed: true
            summary: '{{fields.title.en}}'
            fields:
              - { name: title, label: Heading, widget: object, fields: *text }
              - name: items
                label: Skills
                widget: list
                hint: 'Comma-separated; each one becomes a chip.'
          - name: sections
            label: Sections
            label_singular: Section
            widget: list
            collapsed: true
            summary: '{{fields.title.en}}'
            hint: 'The main column, top to bottom. Drag a section to move it.'
            fields:
              - name: id
                label: Anchor
                widget: string
                required: false
                pattern: ['^[a-z0-9-]+$', 'Lowercase letters, digits and dashes only']
                hint: 'Lets you link straight to the section: cv.html#<anchor>.'
              - name: icon
                label: Icon
                widget: select
                default: briefcase
                options:
                  - { label: 'Briefcase — experience', value: briefcase }
                  - { label: 'Mortarboard — education', value: education }
                  - { label: 'Rosette — distinctions', value: award }
                  - { label: 'Medal — fellowships', value: medal }
                  - { label: 'Lectern — teaching', value: teaching }
                  - { label: 'Open book — training', value: training }
                  - { label: 'Shield — service', value: service }
                  - { label: 'People — community', value: users }
                  - { label: 'Megaphone — outreach', value: megaphone }
                  - { label: 'Presentation — talks', value: talks }
                  - { label: 'Poster', value: posters }
                  - { label: 'Documents — publications', value: pubs }
                  - { label: 'Book — thesis', value: thesis }
                  - { label: 'Brackets — code', value: code }
                  - { label: 'STM tip — instruments', value: stm }
                  - { label: 'Globe', value: globe }
                  - { label: 'Star', value: star }
                  - { label: 'Pencil', value: pencil }
                  - { label: 'Calendar', value: calendar }
                  - { label: 'Link', value: link }
                  - { label: 'Orbital', value: orbital }
              - { name: title, label: Heading, widget: object, fields: *text }
              - name: count
                label: Figure
                widget: string
                required: false
                hint: 'Optional, shown beside the heading — e.g. "265 h" for the teaching total.'
              - name: entries
                label: Entries
                label_singular: Entry
                widget: list
                required: false
                collapsed: true
                add_to_top: true
                summary: '{{fields.years}} · {{fields.title.en}}'
                hint: 'Shown in this order. New entries are added at the top; drag one to move it.'
                fields:
                  - name: years
                    label: Years
                    widget: string
                    required: false
                    hint: 'e.g. "2020 – 2024", or "2025 —" for an ongoing position.'
                  - name: title
                    label: Heading
                    widget: object
                    hint: 'The bold line: institution, degree or distinction.'
                    fields: *text
                  - name: subtitle
                    label: Subheading
                    widget: object
                    required: false
                    hint: 'The line under it: role, supervisor or institution.'
                    fields: &prose
                      - { name: en, label: English, widget: text, required: false }
                      - { name: fr, label: Français, widget: text, required: false }
                      - { name: ko, label: 한국어, widget: text, required: false }
                      - { name: de, label: Deutsch, widget: text, required: false }
                  - name: desc
                    label: Description
                    widget: object
                    required: false
                    hint: 'Link with `[text](url)`, e.g. `[poster gallery](talks.html#posters)`.'
                    fields: *prose
                  - name: chips
                    label: Chips
                    label_singular: Chip
                    widget: list
                    required: false
                    collapsed: true
                    summary: '{{fields.type}} · {{fields.label.en}}'
                    fields:
                      - name: type
                        label: Style
                        widget: select
                        default: topic
                        options:
                          - { label: Topic, value: topic }
                          - { label: 'Award — with a rosette', value: award }
                      - { name: label, label: Text, widget: object, fields: *text }

  # ------------------------------------------------------------- portraits ---
  - name: portraits
    label: Profile pictures
    files:
      - name: portraits
        label: Profile pictures
        file: data/portraits.json
        description: >-
          The round picture on the homepage. With no picture it shows the DJ
          initials; with one, that picture, standing still; with two or more it
          fades from one to the next, top to bottom, and then starts over.
        fields:
          - name: pictures
            label: Pictures
            label_singular: Picture
            widget: list
            required: false
            collapsed: false
            field:
              name: image
              label: Picture
              widget: image
              media_folder: '/assets/img/portraits'
              public_folder: 'assets/img/portraits'
            hint: >-
              Square photos of about 600×600 px work best: the circle is never
              wider than 240 px, so a bigger file only slows the homepage down.
              Drag to change the order.
          - name: stay
            label: Time on screen (seconds)
            widget: number
            value_type: float
            min: 1
            step: 0.5
            default: 6
            hint: 'How long each picture stays before the next one starts fading in.'
          - name: fade
            label: Transition (seconds)
            widget: number
            value_type: float
            min: 0
            step: 0.1
            default: 1.5
            hint: 'How long the fade from one picture to the next lasts. 0 switches instantly.'

  # ------------------------------------------------------------------ misc ---
  - name: misc
    label: Misc
    files:
      - name: site
        label: CV & site files
        file: data/site.json
        description: >-
          The CV PDFs, plus the fixed-name assets listed in the panel beside
          this form.
        fields:
          - name: cv
            label: CV PDFs
            widget: object
            hint: >-
              English is the canonical CV. A language left empty falls back to
              the English PDF, and the download button then says "(EN)". If the
              English one is missing too, the button hides itself.
            fields:
              - name: en
                label: English
                widget: file
                required: false
                media_folder: '/assets/pdf/cv'
                public_folder: 'assets/pdf/cv'
              - name: fr
                label: Français
                widget: file
                required: false
                media_folder: '/assets/pdf/cv'
                public_folder: 'assets/pdf/cv'
              - name: ko
                label: 한국어
                widget: file
                required: false
                media_folder: '/assets/pdf/cv'
                public_folder: 'assets/pdf/cv'
              - name: de
                label: Deutsch
                widget: file
                required: false
                media_folder: '/assets/pdf/cv'
                public_folder: 'assets/pdf/cv'
