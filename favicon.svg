<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .ring { stroke: #00efdf; }
    .ring2 { stroke: #a583bd; }
    .dot { fill: #a583bd; }
    @media (prefers-color-scheme: light) {
      .ring { stroke: #006760; }
      .ring2 { stroke: #714c8b; }
      .dot { fill: #714c8b; }
    }
  </style>
  <g fill="none" stroke-width="3.5" stroke-linecap="round">
    <circle class="ring" cx="32" cy="32" r="26"/>
    <ellipse class="ring2" cx="32" cy="32" rx="26" ry="10" transform="rotate(60 32 32)"/>
    <ellipse class="ring2" cx="32" cy="32" rx="26" ry="10" transform="rotate(-60 32 32)"/>
  </g>
  <circle class="dot" cx="32" cy="32" r="5"/>
</svg>
